# Pokemon Solarus External-Asset Registry
#
# PURPOSE: Durable, project-wide provenance and use-status record for acquired
# third-party assets, including assets that are known locally but not approved.
# This registry is not a license and does not place the source files in Git.
#
# STATUS VALUES:
#   proposed  - named by a Proposed ADR; no implementation/use authorization yet
#   approved  - approved by an Accepted decision for the stated exact scope
#   deferred  - recorded for discovery only; no import/use authorization
#   rejected  - evaluated and intentionally not usable
#   deprecated - retained as history after replacement

